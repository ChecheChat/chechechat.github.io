  <p>客户给一个商品，问「能不能像那条爆款那样做一条」。要回答这个问题，得知道爆款为什么爆、AI 能不能复刻、复刻一条要多少钱多少时间。</p>

  <h2>做了什么</h2>
  <p>选一条 TikTok 电商爆款 → 逐镜拆解开头 / 中段 / 结尾（用自己的工作台）→ 给另一个商品写分镜和 AI 生成计划 → Seedance / 即梦逐镜生成 → 剪映配音、字幕 → 和原片并排对比。全程记录每一步用的工具、生成次数、成本、翻车点。</p>
